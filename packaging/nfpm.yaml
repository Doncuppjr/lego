name: lego
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Donald Cupp <doncuppjr@yahoo.com>
description: ACME client and library written in Go
homepage: https://github.com/go-acme/lego
license: MIT
contents:
  - src: ./work/lego
    dst: /usr/bin/lego
    file_info:
      mode: 0755

  - src: packaging/bin/lego-init
    dst: /usr/bin/lego-init
    file_info:
      mode: 0755

  - src: packaging/systemd/lego-update.service
    dst: /lib/systemd/system/lego-update.service
    file_info:
      mode: 0644

  - src: packaging/systemd/lego-update.timer
    dst: /lib/systemd/system/lego-update.timer
    file_info:
      mode: 0644

  - dst: /etc/lego
    type: dir

  - src: packaging/lego/lego.yml.example
    dst: /etc/lego/lego.yml.example
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
