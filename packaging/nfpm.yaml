name: lego
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Donald Cupp <doncuppjr@yahoo.com>
description: ACME client and library written in Go
homepage: https://github.com/go-acme/lego
license: MIT
contents:
  - src: ./work/lego
    dst: /usr/bin/lego
    file_info:
      mode: 0755

  - src: packaging/bin/lego-init
    dst: /usr/bin/lego-init
    file_info:
      mode: 0755

  - src: packaging/systemd/lego-update.service
    dst: /lib/systemd/system/lego-update.service
    file_info:
      mode: 0644

  - src: packaging/systemd/lego-update.timer
    dst: /lib/systemd/system/lego-update.timer
    file_info:
      mode: 0644

  - dst: /etc/lego
    type: dir

  - src: packaging/lego/lego.yml.example
    dst: /etc/lego/lego.yml.example
    type: config|noreplace
    file_info:
      mode: 0644

  - dst: /var/lib/lego
    type: dir
    file_info:
      mode: 0700

  - dst: /etc/lego/hooks
    type: dir

  - dst: /etc/lego/hooks/pre.d
    type: dir

  - dst: /etc/lego/hooks/deploy.d
    type: dir

  - dst: /etc/lego/hooks/post.d
    type: dir

  - src: packaging/lib/lego/hooks/run-pre-hooks
    dst: /usr/lib/lego/hooks/run-pre-hooks
    file_info:
      mode: 0755

  - src: packaging/lib/lego/hooks/run-deploy-hooks
    dst: /usr/lib/lego/hooks/run-deploy-hooks
    file_info:
      mode: 0755

  - src: packaging/lib/lego/hooks/run-post-hooks
    dst: /usr/lib/lego/hooks/run-post-hooks
    file_info:
      mode: 0755

  - src: packaging/examples/hooks/pre.d/10-stop-webservers
    dst: /usr/share/doc/lego/examples/hooks/pre.d/10-stop-webservers
    file_info:
      mode: 0755

  - src: packaging/examples/hooks/deploy.d/50-export-mcs-jks
    dst: /usr/share/doc/lego/examples/hooks/deploy.d/50-export-mcs-jks
    file_info:
      mode: 0755

  - src: packaging/examples/hooks/post.d/90-start-webservers
    dst: /usr/share/doc/lego/examples/hooks/post.d/90-start-webservers
    file_info:
      mode: 0755

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
